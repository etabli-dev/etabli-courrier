name: Prepare signed release artifacts
# Manual preparation only. Upload/publication to a store or GitHub Release is a
# separate maintainer action after review and device/live-service acceptance.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 tool/check_licenses.py
      - name: Configure private release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.COURRIER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.COURRIER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COURRIER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COURRIER_KEY_PASSWORD }}
        run: |
          python3 - <<'PY_SIGN'
          import base64, os
          from pathlib import Path
          names = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Release signing secrets are not configured.')
          key = Path('android/release.jks')
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return ''.join('\\u%04x' % ord(c) for c in value)
          values = {'storeFile': 'release.jks', 'storePassword': os.environ['STORE_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS'], 'keyPassword': os.environ['KEY_PASSWORD']}
          props = Path('android/keystore.properties')
          props.write_text(''.join(k + '=' + escape(v) + '\n' for k, v in values.items()))
          props.chmod(0o600)
          PY_SIGN
      - run: flutter build apk --release --split-per-abi --no-pub
      - run: flutter build appbundle --release --no-pub
      - name: Record package hashes
        run: find build/app/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec sha256sum {} + > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: courrier-signed-review
          path: |
            build/app/outputs/flutter-apk/*release.apk
            build/app/outputs/bundle/release/*.aab
            SHA256SUMS.txt
            NOTICE
            LICENSE
            THIRD_PARTY_LICENSES.md
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/release.jks android/keystore.properties
