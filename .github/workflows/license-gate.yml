name: License gate
on:
  push:
    branches: [main, 'refine/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/check_licenses.py
      - name: Ensure private signing and test secrets are untracked
        run: |
          if git ls-files | grep -E '(^|/)(secrets.json|keystore.properties)$|\.(jks|keystore)$'; then
            echo 'Private configuration must not be tracked.'
            exit 1
          fi
