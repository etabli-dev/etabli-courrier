name: courrier
description: "Offline communication workspace with manual Nextcloud synchronization, IMAP reading, notes, tasks, reminders and feeds. Member of the Établi Suite."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.0

# v0.1.0 dependencies are added per milestone (enough_mail at M6, flutter_appauth at M8,
# rrule at M3, flutter_local_notifications at M5). Each addition is recorded in NOTICE
# and audited by .github/workflows/license-gate.yml.
dependencies:
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  drift: ^2.20.0
  enough_mail: ^2.1.6
  flutter:
    sdk: flutter
  flutter_appauth: ^9.0.0
  flutter_local_notifications:
    path: third_party/flutter_local_notifications
  flutter_secure_storage: ^10.0.0
  flutter_timezone: 5.1.1
  html: ^0.15.4
  http: ^1.2.0
  intl: ^0.19.0
  local_auth: ^2.3.0
  meta: ^1.18.0
  path: ^1.9.0
  path_provider: ^2.1.4
  rrule: ^0.2.16
  shared_preferences: ^2.3.0
  sqlite3_flutter_libs: ^0.5.24
  timezone: ^0.11.2
  xml: ^6.5.0

# Keep the compatible 1.x API while applying the reviewed Windows coroutine fix.
dependency_overrides:
  local_auth_windows:
    path: third_party/local_auth_windows

dev_dependencies:
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Windows MSIX packaging in CI (`dart run msix:create`); never shipped in the app.
  msix: 3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample/holidays_2026.ics

# Windows MSIX package built by .github/workflows/desktop.yml after
# `flutter build windows`. Unsigned until a code-signing certificate exists;
# `publisher` must then match the certificate subject (docs/platform-roadmap.md).
msix_config:
  display_name: Établi Courrier
  publisher_display_name: R. Heller
  identity_name: dev.etabli.courrier
  logo_path: linux/packaging/dev.etabli.courrier.png
  capabilities: internetClient
  languages: en-us
  architecture: x64
  build_windows: false
  sign_msix: false
  install_certificate: false
  store: false
  output_path: build/windows/msix
  output_name: etabli-courrier
